[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "AmazonHelp support agent pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0,<3",
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "sentence-transformers>=2.6,<4",
  "openai>=1.30,<2",
  "anthropic>=0.34,<1",
  "tenacity>=8.2,<10",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["utils*", "eval*"]
